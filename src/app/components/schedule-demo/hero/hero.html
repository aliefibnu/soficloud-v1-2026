<section
  class="w-full rounded-3xl lg:rounded-[32px] bg-white shadow-[0_12px_45px_-5px_rgba(24,40,73,0.06)] border border-slate-100/90 overflow-hidden px-6 sm:px-10 lg:px-12 xl:px-14 py-6 sm:py-7 lg:py-8 xl:py-9"
  aria-labelledby="hero-heading"
>
  <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 lg:gap-8 xl:gap-10 items-center">
    <!-- Left Column: Hero Illustration -->
    <div class="lg:col-span-5 xl:col-span-5 flex items-center justify-center">
      <img
        ngSrc="/images/schedule-demo/illustration.svg"
        width="517"
        height="606"
        priority
        [alt]="'SCHEDULE_DEMO.HERO.TITLE' | translate"
        class="w-full h-auto max-w-[260px] sm:max-w-[300px] md:max-w-[330px] lg:max-w-[350px] xl:max-w-[370px] max-h-[300px] sm:max-h-[340px] lg:max-h-[380px] xl:max-h-[400px] object-contain select-none pointer-events-none"
      />
    </div>

    <!-- Right Column: Hero Typography -->
    <div class="lg:col-span-7 xl:col-span-7 flex flex-col justify-center text-left">
      <h1
        id="hero-heading"
        class="font-dm-sans font-bold text-[#182849] text-2xl sm:text-3xl lg:text-[36px] xl:text-[40px] leading-tight lg:leading-[1.18] tracking-tight text-balance"
      >
        {{ 'SCHEDULE_DEMO.HERO.TITLE' | translate }}
      </h1>

      <p
        class="mt-3 sm:mt-4 font-dm-sans font-normal text-slate-600 text-sm sm:text-base leading-relaxed max-w-lg text-balance"
      >
        {{ 'SCHEDULE_DEMO.HERO.SUBTITLE' | translate }}
      </p>
    </div>
  </div>
</section>
