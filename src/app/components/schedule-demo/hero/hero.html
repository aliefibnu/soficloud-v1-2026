<section
  class="relative w-full rounded-3xl bg-white shadow-[0_12px_45px_-5px_rgba(24,40,73,0.06)] overflow-hidden"
  aria-labelledby="hero-heading"
>
  <div class="flex flex-col lg:flex-row items-stretch">
    <div
      class="w-full lg:w-[46%] xl:w-123.75 2xl:w-138.75 shrink-0 flex items-end justify-center lg:justify-start pl-6 sm:pl-10 lg:pl-8 xl:pl-8.25 2xl:pl-9.5 pr-6 sm:pr-10 lg:pr-0 pt-6 sm:pt-8 lg:pt-8 xl:pt-8 2xl:pt-9.75 pb-0"
    >
      <div
        role="img"
        [attr.aria-label]="'SCHEDULE_DEMO.HERO.TITLE' | translate"
        data-testid="schedule-demo-hero-illustration"
        class="relative w-full max-w-[320px] sm:max-w-95 md:max-w-105 lg:max-w-110 xl:max-w-115 2xl:max-w-129.25 aspect-[517/606] select-none pointer-events-none"
      >
        <img
          ngSrc="/images/schedule-demo/dashed-ring.svg"
          width="430"
          height="430"
          priority
          alt=""
          aria-hidden="true"
          class="animate-hero-ring-spin absolute left-[16.325%] top-0 w-[83.172%] h-[70.957%] object-contain select-none pointer-events-none z-0"
        />

        <img
          ngSrc="/images/schedule-demo/phone-mockup.svg"
          width="350"
          height="533"
          priority
          alt=""
          aria-hidden="true"
          class="absolute left-[26.692%] top-[11.981%] w-[67.698%] h-[87.954%] object-contain select-none pointer-events-none z-10"
        />

        <img
          ngSrc="/images/schedule-demo/chat-bubble-left.svg"
          width="238"
          height="76"
          priority
          alt=""
          aria-hidden="true"
          class="animate-hero-bubble-left will-change-transform absolute left-0 top-[39.209%] w-[46.035%] h-[12.541%] object-contain select-none pointer-events-none z-20"
        />

        <img
          ngSrc="/images/schedule-demo/chat-bubble-right.svg"
          width="216"
          height="77"
          priority
          alt=""
          aria-hidden="true"
          class="animate-hero-bubble-right will-change-transform absolute left-[58.405%] top-[59.341%] w-[41.780%] h-[12.706%] object-contain select-none pointer-events-none z-20"
        />

        <img
          ngSrc="/images/schedule-demo/user-badge.svg"
          width="75"
          height="80"
          priority
          alt=""
          aria-hidden="true"
          class="animate-hero-bell-ring will-change-transform absolute left-[81.625%] top-[1.915%] w-[14.507%] h-[13.201%] object-contain select-none pointer-events-none z-20"
        />
      </div>
    </div>

    <div
      class="flex-1 flex flex-col justify-center text-left px-6 sm:px-10 lg:pl-14 xl:pl-20 2xl:pl-24 lg:pr-8 xl:pr-10 py-8 sm:py-10 lg:py-12"
    >
      <h1
        id="hero-heading"
        class="font-inter font-extrabold text-[#23244E] text-3xl sm:text-4xl md:text-5xl lg:text-[50px] xl:text-[56px] 2xl:text-[64px] leading-tight lg:leading-[1.2] xl:leading-tight tracking-tight xl:tracking-normal max-w-103.75 2xl:max-w-119 text-balance"
      >
        {{ 'SCHEDULE_DEMO.HERO.TITLE' | translate }}
      </h1>

      <p
        class="mt-3 sm:mt-4 lg:mt-3 font-dm-sans font-normal text-[#23244E] text-sm sm:text-base lg:text-[13px] xl:text-[13.5px] 2xl:text-[14px] leading-relaxed lg:leading-[1.3] max-w-85 2xl:max-w-93.75 text-justify"
      >
        {{ 'SCHEDULE_DEMO.HERO.SUBTITLE' | translate }}
      </p>
    </div>
  </div>
</section>
