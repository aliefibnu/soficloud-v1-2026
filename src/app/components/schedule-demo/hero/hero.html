<section
  class="w-full rounded-3xl lg:rounded-[32px] bg-white shadow-[0_12px_45px_-5px_rgba(24,40,73,0.06)] border border-slate-100/90 overflow-hidden p-6 sm:p-10 lg:p-14 xl:p-16"
  aria-labelledby="hero-heading"
>
  <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 lg:gap-12 items-center">
    <!-- Left Column: Hero Illustration -->
    <div class="lg:col-span-5 xl:col-span-6 flex items-center justify-center">
      <img
        ngSrc="/images/schedule-demo/illustration.svg"
        width="517"
        height="606"
        priority
        [alt]="'SCHEDULE_DEMO.HERO.TITLE' | translate"
        class="w-full h-auto max-w-[380px] sm:max-w-[420px] lg:max-w-[480px] object-contain select-none pointer-events-none"
      />
    </div>

    <!-- Right Column: Hero Typography -->
    <div class="lg:col-span-7 xl:col-span-6 flex flex-col justify-center text-left">
      <h1
        id="hero-heading"
        class="font-dm-sans font-bold text-[#182849] text-3xl sm:text-4xl lg:text-[42px] xl:text-5xl leading-tight lg:leading-[1.18] tracking-tight text-balance"
      >
        {{ 'SCHEDULE_DEMO.HERO.TITLE' | translate }}
      </h1>

      <p
        class="mt-4 sm:mt-6 font-dm-sans font-normal text-slate-600 text-base sm:text-lg leading-relaxed max-w-xl text-balance"
      >
        {{ 'SCHEDULE_DEMO.HERO.SUBTITLE' | translate }}
      </p>
    </div>
  </div>
</section>
