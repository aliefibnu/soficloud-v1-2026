<section
  class="relative w-full rounded-3xl lg:rounded-4xl bg-white shadow-[0_12px_45px_-5px_rgba(24,40,73,0.06)] border border-slate-100/90 overflow-hidden"
  aria-labelledby="hero-heading"
>
  <div class="flex flex-col lg:flex-row items-stretch">
    <!-- Left Column: Hero Illustration (Close to Top Border & Flush to Bottom on Desktop) -->
    <div
      class="w-full lg:w-[46%] xl:w-[555px] shrink-0 flex items-end justify-center lg:justify-start pl-6 sm:pl-10 lg:pl-8 xl:pl-[38px] pr-6 sm:pr-10 lg:pr-0 pt-6 sm:pt-8 lg:pt-8 xl:pt-[39px] pb-0"
    >
      <img
        ngSrc="/images/schedule-demo/illustration.svg"
        width="517"
        height="606"
        priority
        [alt]="'SCHEDULE_DEMO.HERO.TITLE' | translate"
        class="w-full h-auto max-w-[320px] sm:max-w-[380px] md:max-w-[440px] lg:max-w-[480px] xl:max-w-[517px] object-contain object-bottom select-none pointer-events-none"
      />
    </div>

    <!-- Right Column: Hero Typography (Vertically Centered with Generous Gap from Illustration) -->
    <div
      class="flex-1 flex flex-col justify-center text-left px-6 sm:px-10 lg:pl-14 xl:pl-24 lg:pr-8 xl:pr-10 py-8 sm:py-10 lg:py-12"
    >
      <h1
        id="hero-heading"
        class="font-inter font-extrabold text-[#23244E] text-3xl sm:text-4xl md:text-5xl lg:text-[54px] xl:text-[64px] leading-tight lg:leading-[1.2] xl:leading-[1.25] tracking-tight xl:tracking-normal max-w-[476px] text-balance"
      >
        {{ 'SCHEDULE_DEMO.HERO.TITLE' | translate }}
      </h1>

      <p
        class="mt-3 sm:mt-4 lg:mt-3 font-dm-sans font-normal text-[#23244E] text-sm sm:text-base lg:text-[14px] leading-relaxed lg:leading-[1.3] max-w-[375px] text-justify"
      >
        {{ 'SCHEDULE_DEMO.HERO.SUBTITLE' | translate }}
      </p>
    </div>
  </div>
</section>
