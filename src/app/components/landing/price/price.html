<section
  id="pricing"
  class="relative w-full py-section bg-white overflow-hidden scroll-mt-20"
  aria-labelledby="price-heading"
>
  <div
    class="pointer-events-none absolute inset-x-0 top-0 h-72 sm:h-80 md:h-95 lg:h-105 w-full overflow-hidden select-none z-0"
    aria-hidden="true"
  >
    <svg
      class="w-full h-full"
      viewBox="0 0 1440 280"
      fill="none"
      preserveAspectRatio="none"
      xmlns="http://www.w3.org/2000/svg"
    >
      <path
        d="M0,0 L1440,0 L1440,150 C1360,215 1080,180 800,165 C600,150 280,110 0,215 Z"
        fill="#3874db"
      />
    </svg>
  </div>

  <div class="relative z-10 w-full max-w-7xl xl:max-w-310 mx-auto px-4 sm:px-6 lg:px-8 xl:px-0">
    <div
      class="relative bg-white rounded-2xl shadow-[0_12px_45px_-5px_rgba(0,0,0,0.08)] border-b border-l border-slate-100/90 overflow-hidden flex flex-col lg:flex-row items-stretch"
    >
      <div
        class="flex-1 min-w-0 flex flex-col justify-center px-6 sm:px-10 lg:pl-14 lg:pr-6 py-8 sm:py-10 lg:py-12 z-10"
      >
        <h2
          id="price-heading"
          class="font-inter font-semibold text-2xl sm:text-3xl md:text-4xl lg:text-[44px] text-[#23244E] leading-tight tracking-[-0.02em] whitespace-pre-line"
        >
          {{ 'PRICE.HEADING' | translate }}
        </h2>

        <p
          class="mt-4 sm:mt-5 font-dm-sans font-normal text-xs sm:text-sm text-[#23244E]/80 tracking-normal"
        >
          {{ 'PRICE.STARTING_FROM' | translate }}
        </p>

        <div
          class="mt-1.5 font-inter font-extrabold text-3xl sm:text-4xl lg:text-[56px] text-[#23244E] tracking-tight leading-none"
        >
          {{ 'PRICE.AMOUNT' | translate }}
        </div>

        <div class="mt-6 sm:mt-8">
          <button
            type="button"
            class="group w-full sm:w-110 h-12 rounded-[10px] bg-linear-to-r from-[#1E37E1] via-[#1C7DD8] to-[#6694EB] hover:opacity-95 active:scale-[0.99] transition-all flex items-center justify-center font-dm-sans font-semibold text-base sm:text-[17px] text-white leading-[130%] shadow-sm hover:shadow-md cursor-pointer focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#1E37E1]"
            [attr.aria-label]="'PRICE.BUTTON' | translate"
          >
            <span>{{ 'PRICE.BUTTON' | translate }}</span>
          </button>
        </div>
      </div>

      <div
        class="relative w-full lg:w-[48%] xl:w-[50%] min-h-65 sm:min-h-75 lg:min-h-88.5 overflow-hidden select-none pointer-events-none"
        aria-hidden="true"
      >
        <img
          ngSrc="/images/landing/price/arrow-graph.svg"
          width="636"
          height="361"
          alt=""
          class="pointer-events-none absolute -top-20 sm:-top-28 lg:-top-37 -right-4 sm:-right-8 lg:-right-10 w-125 sm:w-145 lg:w-159 max-w-none opacity-40 object-contain object-top-right"
        />

        <img
          ngSrc="/images/landing/price/pillar-1.svg"
          width="131"
          height="106"
          alt=""
          class="pointer-events-none absolute bottom-0 right-80 sm:right-90 lg:right-102.5 w-23.75 sm:w-27.5 lg:w-32.75 h-auto opacity-40"
        />

        <img
          ngSrc="/images/landing/price/pillar-2.svg"
          width="131"
          height="202"
          alt=""
          class="pointer-events-none absolute bottom-0 right-37.5 sm:right-43.75 lg:right-50 w-23.75 sm:w-27.5 lg:w-32.75 h-auto opacity-40"
        />

        <img
          ngSrc="/images/landing/price/pillar-3.svg"
          width="131"
          height="298"
          alt=""
          class="pointer-events-none absolute bottom-0 right-0 w-23.75 sm:w-27.5 lg:w-32.75 h-auto opacity-40"
        />

        <img
          ngSrc="/images/landing/price/bottom-coins.svg"
          width="198"
          height="113"
          alt=""
          class="pointer-events-none absolute bottom-0 right-47.5 sm:right-53.75 lg:right-60 z-10 h-auto w-41.25 lg:w-49.5"
        />

        <img
          ngSrc="/images/landing/price/coins.svg"
          width="216"
          height="210"
          alt=""
          class="pointer-events-none absolute bottom-0 right-17.5 lg:right-21.25 z-20 h-auto w-45 lg:w-54"
        />

        <img
          ngSrc="/images/landing/price/coin.svg"
          width="182"
          height="182"
          alt=""
          class="pointer-events-none absolute top-4 lg:top-7 right-21.25 lg:right-25.5 z-30 h-auto w-37.5 lg:w-45.5"
        />
      </div>
    </div>
  </div>
</section>
