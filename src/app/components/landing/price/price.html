<section
  id="pricing"
  class="relative w-full py-section bg-white overflow-hidden scroll-mt-20"
  aria-labelledby="price-heading"
>
  <!-- Decorative background wave band -->
  <div
    class="pointer-events-none absolute inset-x-0 top-0 h-72 sm:h-80 md:h-95 lg:h-105 w-full overflow-hidden select-none z-0"
    aria-hidden="true"
  >
    <svg
      class="w-full h-full"
      viewBox="0 0 1440 280"
      fill="none"
      preserveAspectRatio="none"
      xmlns="http://www.w3.org/2000/svg"
    >
      <path
        d="M0,0 L1440,0 L1440,150 C1360,215 1080,180 800,165 C600,150 280,110 0,215 Z"
        fill="#3874db"
      />
    </svg>
  </div>

  <div class="relative z-10 w-full max-w-7xl xl:max-w-310 mx-auto px-4 sm:px-6 lg:px-8 xl:px-0">
    <div
      class="relative bg-white rounded-2xl shadow-[0_12px_45px_-5px_rgba(0,0,0,0.08)] border-y border-l border-slate-100/90 overflow-hidden flex flex-col lg:flex-row items-stretch"
    >
      <!-- Left Column: Copy & Pricing & CTA Button -->
      <div
        class="flex-1 min-w-0 flex flex-col justify-center px-6 sm:px-10 lg:pl-14 lg:pr-6 py-8 sm:py-10 lg:py-12 z-10"
      >
        <h2
          id="price-heading"
          class="font-inter font-semibold text-2xl sm:text-3xl md:text-4xl lg:text-[44px] text-[#23244E] leading-tight tracking-[-0.02em] whitespace-pre-line"
        >
          {{ 'PRICE.HEADING' | translate }}
        </h2>

        <p
          class="mt-4 sm:mt-5 font-dm-sans font-normal text-xs sm:text-sm text-[#23244E]/80 tracking-normal"
        >
          {{ 'PRICE.STARTING_FROM' | translate }}
        </p>

        <div
          class="mt-1.5 font-inter font-extrabold text-3xl sm:text-4xl lg:text-[56px] text-[#23244E] tracking-tight leading-none"
        >
          {{ 'PRICE.AMOUNT' | translate }}
        </div>

        <div class="mt-6 sm:mt-8">
          <button
            type="button"
            class="group w-full sm:w-[440px] h-12 rounded-[10px] bg-gradient-to-r from-[#1E37E1] via-[#1C7DD8] to-[#6694EB] hover:opacity-95 active:scale-[0.99] transition-all flex items-center justify-center font-dm-sans font-semibold text-base sm:text-[17px] text-white leading-[130%] shadow-sm hover:shadow-md cursor-pointer focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#1E37E1]"
            [attr.aria-label]="'PRICE.BUTTON' | translate"
          >
            <span>{{ 'PRICE.BUTTON' | translate }}</span>
          </button>
        </div>
      </div>

      <!-- Right Column: Illustration (Arrow, Pillars, Coins) -->
      <div
        class="relative w-full lg:w-[48%] xl:w-[50%] min-h-[260px] sm:min-h-[300px] lg:min-h-[354px] overflow-hidden select-none pointer-events-none"
        aria-hidden="true"
      >
        <!-- Arrow Graph (Background, pushed upwards so top peak/arrowhead cross the card border) -->
        <img
          ngSrc="/images/price/arrow-graph.svg"
          width="636"
          height="361"
          alt=""
          class="pointer-events-none absolute -top-20 sm:-top-28 lg:-top-[148px] -right-4 sm:-right-8 lg:-right-[40px] w-[500px] sm:w-[580px] lg:w-[636px] max-w-none opacity-40 object-contain object-right-top"
        />

        <!-- 3 Pillars (Stepped Bar Chart with Gaps & Reduced Opacity) -->
        <!-- Pillar 1 (Left): height 106px -->
        <img
          ngSrc="/images/price/pillar-1.svg"
          width="131"
          height="106"
          alt=""
          class="pointer-events-none absolute bottom-0 right-[320px] sm:right-[360px] lg:right-[410px] w-[95px] sm:w-[110px] lg:w-[131px] h-auto opacity-40"
        />

        <!-- Pillar 2 (Middle, behind coins): height 202px -->
        <img
          ngSrc="/images/price/pillar-2.svg"
          width="131"
          height="202"
          alt=""
          class="pointer-events-none absolute bottom-0 right-[150px] sm:right-[175px] lg:right-[200px] w-[95px] sm:w-[110px] lg:w-[131px] h-auto opacity-40"
        />

        <!-- Pillar 3 (Right): height 298px -->
        <img
          ngSrc="/images/price/pillar-3.svg"
          width="131"
          height="298"
          alt=""
          class="pointer-events-none absolute bottom-0 -right-px right-0 w-[95px] sm:w-[110px] lg:w-[131px] h-auto opacity-40"
        />

        <!-- Bottom Angled Coin (On par with Pillar 1 at bottom-0, layered behind Coins Stack) -->
        <img
          ngSrc="/images/price/bottom-coins.svg"
          width="198"
          height="113"
          alt=""
          class="pointer-events-none absolute bottom-0 right-[190px] sm:right-[215px] lg:right-[240px] z-10 h-auto w-[165px] lg:w-[198px]"
        />

        <!-- Coins Stack (Main Column, layered in front of Bottom Coins) -->
        <img
          ngSrc="/images/price/coins.svg"
          width="216"
          height="210"
          alt=""
          class="pointer-events-none absolute bottom-0 right-[70px] lg:right-[85px] z-20 h-auto w-[180px] lg:w-[216px]"
        />

        <!-- Top Coin (Large Emblem Coin, on top of Coins Stack) -->
        <img
          ngSrc="/images/price/coin.svg"
          width="182"
          height="182"
          alt=""
          class="pointer-events-none absolute top-4 lg:top-7 right-[85px] lg:right-[102px] z-30 h-auto w-[150px] lg:w-[182px]"
        />
      </div>
    </div>
  </div>
</section>
