<section
  id="pricing"
  class="relative w-full py-section bg-white overflow-hidden scroll-mt-24 sm:scroll-mt-28 lg:scroll-mt-32"
  aria-labelledby="price-heading"
>
  <div
    class="pointer-events-none absolute inset-x-0 top-0 h-72 sm:h-80 md:h-95 lg:h-105 w-full overflow-hidden select-none z-0"
    aria-hidden="true"
  >
    <svg
      class="w-full h-full"
      viewBox="0 0 1440 280"
      fill="none"
      preserveAspectRatio="none"
      xmlns="http://www.w3.org/2000/svg"
    >
      <path
        d="M0,0 L1440,0 L1440,150 C1360,215 1080,180 800,165 C600,150 280,110 0,215 Z"
        fill="#3874db"
      />
    </svg>
  </div>

  <div class="relative z-10 w-full max-w-7xl xl:max-w-310 mx-auto px-4 sm:px-6 lg:px-8 xl:px-0">
    <div
      class="relative bg-white rounded-2xl shadow-[0_12px_45px_-5px_rgba(0,0,0,0.08)] border-b border-l border-slate-100/90 overflow-hidden flex flex-col lg:flex-row items-stretch"
    >
      <div
        class="flex-1 min-w-0 flex flex-col justify-center px-6 sm:px-10 lg:pl-14 lg:pr-6 py-8 sm:py-10 lg:py-12 z-10"
      >
        <h2
          id="price-heading"
          class="font-inter font-semibold text-2xl sm:text-3xl md:text-4xl lg:text-[44px] text-[#23244E] leading-tight tracking-[-0.02em] whitespace-pre-line"
        >
          {{ 'PRICE.HEADING' | translate }}
        </h2>

        <p
          class="mt-4 sm:mt-5 font-dm-sans font-normal text-xs sm:text-sm text-[#23244E]/80 tracking-normal"
        >
          {{ 'PRICE.STARTING_FROM' | translate }}
        </p>

        <div
          class="mt-1.5 flex items-baseline font-inter font-extrabold text-3xl sm:text-4xl lg:text-[56px] text-[#23244E] tracking-tight leading-none"
        >
          <span>{{ 'PRICE.AMOUNT' | translate }}</span>
          <span
            class="text-base sm:text-lg lg:text-2xl font-medium tracking-normal text-[#23244E]"
          >
            {{ 'PRICE.PERIOD' | translate }}
          </span>
        </div>

        <div class="mt-6 sm:mt-8">
          <button
            type="button"
            class="group w-full sm:w-110 h-12 rounded-[10px] bg-linear-to-r from-[#1E37E1] via-[#1C7DD8] to-[#6694EB] hover:opacity-95 active:scale-[0.99] transition-all flex items-center justify-center font-dm-sans font-semibold text-base sm:text-[17px] text-white leading-[130%] shadow-sm hover:shadow-md cursor-pointer focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#1E37E1]"
            [attr.aria-label]="'PRICE.BUTTON' | translate"
          >
            <span>{{ 'PRICE.BUTTON' | translate }}</span>
          </button>
        </div>
      </div>

      <div
        class="relative w-full lg:w-[48%] xl:w-[50%] min-h-65 sm:min-h-75 lg:min-h-88.5 overflow-clip xl:overflow-visible select-none pointer-events-none"
        aria-hidden="true"
      >
        <div class="pointer-events-none absolute inset-y-0 right-0 h-full aspect-[998/565]">
          <img
            ngSrc="/images/landing/price/arrow-graph.svg"
            width="636"
            height="361"
            alt=""
            class="pointer-events-none block absolute -top-[42.12%] -right-[2.61%] w-[101.40%] h-auto max-w-none opacity-40"
          />

          <img
            ngSrc="/images/landing/price/pillar-1.svg"
            width="131"
            height="106"
            alt=""
            class="pointer-events-none block absolute -bottom-[5.13%] right-[65.93%] w-[20.94%] h-auto max-w-none opacity-40"
          />

          <img
            ngSrc="/images/landing/price/pillar-2.svg"
            width="131"
            height="202"
            alt=""
            class="pointer-events-none block absolute -bottom-[5.13%] right-[31.86%] w-[20.94%] h-auto max-w-none opacity-40"
          />

          <img
            ngSrc="/images/landing/price/pillar-3.svg"
            width="131"
            height="298"
            alt=""
            class="pointer-events-none block absolute -bottom-[5.13%] -right-[2.20%] w-[20.94%] h-auto max-w-none opacity-40"
          />

          <img
            ngSrc="/images/landing/price/bottom-coins.svg"
            width="198"
            height="113"
            alt=""
            class="pointer-events-none block absolute -bottom-[5.13%] right-[42.89%] z-10 w-[31.66%] h-auto max-w-none"
          />

          <img
            ngSrc="/images/landing/price/coins.svg"
            width="216"
            height="210"
            alt=""
            class="pointer-events-none block absolute -bottom-[5.31%] right-[13.83%] z-20 w-[34.57%] h-auto max-w-none"
          />

          <img
            ngSrc="/images/landing/price/coin.svg"
            width="182"
            height="182"
            alt=""
            class="pointer-events-none block absolute top-[9.56%] right-[17.54%] z-30 w-[29.06%] h-auto max-w-none"
          />
        </div>
      </div>
    </div>
  </div>
</section>
