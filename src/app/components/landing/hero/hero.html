<section id="hero" class="relative w-full pt-29.25 sm:pt-16 md:pt-20 lg:pt-24 pb-section overflow-x-clip">
  <div
    class="pointer-events-none absolute inset-0 -z-10 overflow-hidden select-none"
    aria-hidden="true"
  >
    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-360 h-256 pointer-events-none">
      <div
        class="absolute -top-100.25 -left-137.5 w-333.25 h-328.5 rounded-full bg-[radial-gradient(ellipse_at_center,rgba(168,195,240,0.45)_0%,rgba(168,195,240,0.45)_45%,#FAFCFE_100%)] blur-[235px]"
      ></div>

      <div
        class="absolute top-86 left-23.25 w-170.25 h-167.75 rounded-full bg-[radial-gradient(ellipse_at_center,rgba(168,195,240,0.45)_0%,rgba(168,195,240,0.45)_45%,#FAFCFE_100%)] blur-[235px]"
      ></div>

      <div
        class="absolute -top-56 left-114 w-206.75 h-204.5 rounded-full bg-[radial-gradient(ellipse_at_center,#FFEFED_0%,#FAFCFE_100%)] blur-[176px]"
      ></div>

      <div
        class="absolute -top-8 left-158 w-232 h-270.75 rotate-[15.85deg] rounded-[48%_52%_62%_38%/42%_55%_45%_58%] bg-[radial-gradient(ellipse_at_center,rgba(221,243,243,0.5)_0%,rgba(221,243,243,0.5)_50%,#F8FEFE_100%)] blur-[50px]"
      ></div>
    </div>
  </div>

  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col items-center text-center">
    <div
      class="inline-flex items-center gap-1.5 sm:gap-2 rounded-full border border-[#93c5fd]/70 bg-[#eff6ff]/80 px-3.5 py-1 sm:px-5 sm:py-1.5 text-[10.5px] sm:text-[12.5px] font-semibold uppercase tracking-wider text-[#1d64ec] shadow-2xs backdrop-blur-xs mb-4 sm:mb-7 transition-colors"
    >
      <span class="inline-block w-1.5 h-1.5 rounded-full bg-[#1d64ec] sm:hidden" aria-hidden="true"></span>
      <span>{{ 'HERO.BADGE' | translate }}</span>
    </div>

    <h1
      class="font-inter font-extrabold text-[#182849] text-[28px] sm:text-[38px] md:text-[56px] lg:text-[66px] xl:text-[76px] leading-[1.12] sm:leading-[1.08] md:leading-[1.04] tracking-[-0.03em] sm:tracking-[-0.035em] max-w-sm sm:max-w-6xl mb-3.5 sm:mb-5 text-balance"
    >
      <span class="block md:whitespace-nowrap">{{ 'HERO.TITLE_LINE_1' | translate }}</span>
      <span class="block md:whitespace-nowrap">
        <span>{{ 'HERO.TITLE_LINE_2_PREFIX' | translate }}</span>
        <span class="text-[#1d64ec]">{{ 'HERO.TITLE_LINE_2_HIGHLIGHT' | translate }}</span>
      </span>
    </h1>

    <p
      class="font-dm-sans font-normal text-[#182849]/75 sm:text-[#182849]/80 text-[14px] sm:text-[16.5px] md:text-[17.5px] lg:text-[18.5px] leading-relaxed max-w-xs sm:max-w-4xl md:whitespace-nowrap text-balance"
    >
      {{ 'HERO.SUBTITLE' | translate }}
    </p>

    <div class="mt-6 sm:mt-7 flex flex-row items-center justify-center gap-2.5 sm:gap-4 w-full max-w-85 sm:max-w-none sm:w-auto">
      <button
        type="button"
        (click)="onWatchVideo()"
        [attr.aria-label]="'HERO.ARIA.WATCH_VIDEO' | translate"
        class="group relative overflow-hidden flex-1 sm:flex-none inline-flex items-center justify-center gap-1.5 sm:gap-3 px-4 py-2.5 sm:px-7 sm:py-2.5 rounded-xl bg-linear-to-r from-[#1d44eb] via-[#2563eb] to-[#3b82f6] text-white font-display text-[13.5px] sm:text-xl font-semibold shadow-xs hover:shadow-md active:scale-[0.98] transition-all duration-300 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#1d44eb] cursor-pointer before:absolute before:inset-0 before:bg-linear-to-r before:from-[#1738c2] before:via-[#1e4ed8] before:to-[#2563eb] before:opacity-0 hover:before:opacity-100 before:transition-opacity before:duration-300 motion-reduce:before:transition-none"
      >
        <img
          ngSrc="/images/landing/hero/play-white.svg"
          alt=""
          width="16"
          height="18"
          aria-hidden="true"
          class="relative z-10 w-auto h-3.5 sm:h-[17.5px] shrink-0 pointer-events-none select-none"
        />
        <span class="relative z-10 whitespace-nowrap">{{ 'HERO.ACTIONS.WATCH_VIDEO' | translate }}</span>
      </button>

      <button
        type="button"
        (click)="onAbout()"
        [attr.aria-label]="'HERO.ARIA.ABOUT_SOFICLOUD' | translate"
        class="group flex-1 sm:flex-none inline-flex items-center justify-center px-4 py-2.5 sm:px-7 sm:py-2.5 rounded-xl border border-[#2563eb] bg-white hover:bg-[#F0F5FE] text-[#1C73E8] hover:text-[#1738c2] font-display text-[13.5px] sm:text-xl font-semibold shadow-xs hover:shadow-sm active:scale-[0.98] transition-all duration-300 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#1d44eb] cursor-pointer"
      >
        <span class="whitespace-nowrap">{{ 'HERO.ACTIONS.ABOUT_SOFICLOUD' | translate }}</span>
      </button>
    </div>

    <div class="mt-7 sm:mt-14 md:mt-16 w-full max-w-6xl xl:max-w-7xl">
      <app-ui-mockup />
    </div>
  </div>
</section>
