<section id="hero" class="relative w-full pt-25 sm:pt-34.25 md:pt-39.25 lg:pt-43.25 pb-section overflow-x-clip">
  <div
    class="pointer-events-none absolute inset-0 -z-10 overflow-hidden select-none mask-[linear-gradient(to_bottom,#000_0%,#000_72%,transparent_100%)]"
    aria-hidden="true"
  >
    <div
      class="hero-ambient-canvas opacity-45 sm:opacity-100 absolute top-0 left-1/2 -translate-x-1/2 w-360 h-256 pointer-events-none"
    >
      <div
        class="absolute -top-100.25 -left-137.5 w-333.25 h-328.5 rounded-full bg-[radial-gradient(ellipse_at_center,rgba(168,195,240,0.42)_0%,rgba(168,195,240,0.22)_35%,rgba(168,195,240,0.06)_62%,transparent_80%)]"
      ></div>

      <div
        class="absolute top-86 left-23.25 w-170.25 h-167.75 rounded-full bg-[radial-gradient(ellipse_at_center,rgba(168,195,240,0.42)_0%,rgba(168,195,240,0.20)_35%,rgba(168,195,240,0.05)_62%,transparent_80%)]"
      ></div>

      <div
        class="absolute -top-56 left-114 w-206.75 h-204.5 rounded-full bg-[radial-gradient(ellipse_at_center,rgba(255,239,237,0.95)_0%,rgba(255,239,237,0.45)_38%,transparent_76%)]"
      ></div>

      <div
        class="absolute -top-8 left-158 w-232 h-270.75 rotate-[15.85deg] rounded-[48%_52%_62%_38%/42%_55%_45%_58%] bg-[radial-gradient(ellipse_at_center,rgba(221,243,243,0.48)_0%,rgba(221,243,243,0.26)_42%,transparent_75%)]"
      ></div>
    </div>

    <div
      class="hero-bottom-fade pointer-events-none absolute inset-x-0 bottom-0 h-32 sm:h-44 lg:h-56 bg-linear-to-t from-white via-white/85 to-transparent"
    ></div>
  </div>

  <div class="max-w-7xl mx-auto px-5 sm:px-6 lg:px-8 flex flex-col items-start text-left sm:items-center sm:text-center">
    <h1
      class="font-inter font-extrabold text-[#23244E] text-[clamp(1.75rem,1.25rem+2.5vw,2.125rem)] sm:text-[38px] md:text-[56px] lg:text-[66px] xl:text-[76px] leading-[1.12] sm:leading-[1.08] md:leading-[1.04] tracking-[-0.03em] sm:tracking-[-0.035em] max-w-[20ch] sm:max-w-6xl mb-3 sm:mb-5 text-balance"
    >
      <span class="inline sm:block md:whitespace-nowrap">{{ 'HERO.TITLE_LINE_1' | translate }}</span>{{ ' ' }}<span class="inline sm:block md:whitespace-nowrap">
        <span>{{ 'HERO.TITLE_LINE_2_PREFIX' | translate }}</span>
        <span class="text-[#1C73E8]">{{ 'HERO.TITLE_LINE_2_HIGHLIGHT' | translate }}</span>
      </span>
    </h1>

    <p
      class="font-dm-sans font-normal text-[#475569] sm:text-[#000000] text-[0.9375rem] sm:text-[16.5px] md:text-[17.5px] lg:text-[18.5px] leading-[1.6] sm:leading-relaxed max-w-[38ch] sm:max-w-4xl md:whitespace-nowrap text-pretty sm:text-balance"
    >
      {{ 'HERO.SUBTITLE' | translate }}
    </p>

    <div class="mt-6 sm:mt-7 flex flex-col sm:flex-row items-stretch sm:items-center justify-center gap-2.5 sm:gap-4 w-full sm:w-auto">
      <button
        type="button"
        (click)="onWatchVideo()"
        [attr.aria-label]="'HERO.ARIA.WATCH_VIDEO' | translate"
        class="group relative overflow-hidden w-full sm:w-auto min-h-12 sm:min-h-0 inline-flex items-center justify-center gap-2 sm:gap-3 px-5 py-3 sm:px-7 sm:py-2.5 rounded-xl bg-linear-to-r from-[#1d44eb] via-[#2563eb] to-[#3b82f6] text-white font-display text-[0.9375rem] sm:text-xl font-semibold shadow-[0_6px_18px_-6px_rgba(29,68,235,0.45)] sm:shadow-xs hover:shadow-md active:scale-[0.98] transition-all duration-300 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#1d44eb] cursor-pointer before:absolute before:inset-0 before:bg-linear-to-r before:from-[#1738c2] before:via-[#1e4ed8] before:to-[#2563eb] before:opacity-0 hover:before:opacity-100 before:transition-opacity before:duration-300 motion-reduce:before:transition-none"
      >
        <img
          ngSrc="/images/landing/hero/play-white.svg"
          alt=""
          width="16"
          height="18"
          aria-hidden="true"
          class="relative z-10 w-auto h-3.5 sm:h-[17.5px] shrink-0 pointer-events-none select-none"
        />
        <span class="relative z-10 sm:whitespace-nowrap">{{ 'HERO.ACTIONS.WATCH_VIDEO' | translate }}</span>
      </button>

      <button
        type="button"
        (click)="onAbout()"
        [attr.aria-label]="'HERO.ARIA.ABOUT_SOFICLOUD' | translate"
        class="group w-full sm:w-auto min-h-12 sm:min-h-0 inline-flex items-center justify-center px-5 py-3 sm:px-7 sm:py-2.5 rounded-xl border border-[#cbd5e1] sm:border-[#2563eb] bg-white/95 sm:bg-white hover:border-[#2563eb] hover:bg-[#F0F5FE] text-[#182849] sm:text-[#1C73E8] hover:text-[#1738c2] font-display text-[0.9375rem] sm:text-xl font-semibold shadow-2xs sm:shadow-xs hover:shadow-sm active:scale-[0.98] transition-all duration-300 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#1d44eb] cursor-pointer"
      >
        <span class="sm:whitespace-nowrap">{{ 'HERO.ACTIONS.ABOUT_SOFICLOUD' | translate }}</span>
      </button>
    </div>

    <div class="mt-8 sm:mt-14 md:mt-16 w-full max-w-6xl xl:max-w-7xl">
      <app-ui-mockup />
    </div>
  </div>
</section>
