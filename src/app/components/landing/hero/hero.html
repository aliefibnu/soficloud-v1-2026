<section id="hero" class="relative w-full pt-12 sm:pt-16 md:pt-20 lg:pt-24 pb-section overflow-x-clip">
  <!-- blue shade/gradients -->
  <div
    class="pointer-events-none absolute inset-0 -z-10 overflow-hidden select-none"
    aria-hidden="true"
  >
    <div
      class="absolute inset-0 bg-[radial-gradient(ellipse_80%_90%_at_-10%_35%,rgba(219,234,254,0.75)_0%,rgba(235,244,255,0.45)_45%,rgba(255,255,255,0)_80%)]"
    ></div>

    <div
      class="absolute -top-16 -left-28 sm:-top-24 sm:-left-36 h-96 w-96 sm:h-135 sm:w-135 lg:h-180 lg:w-180 rounded-full bg-linear-to-br from-[#c7e0ff]/70 via-[#dbeafe]/50 to-transparent blur-3xl opacity-80"
    ></div>

    <div
      class="absolute top-1/4 -left-20 sm:top-1/4 sm:-left-24 h-72 w-72 sm:h-105 sm:w-105 lg:h-140 lg:w-140 rounded-full bg-linear-to-tr from-[#dbeafe]/60 via-[#eff6ff]/40 to-transparent blur-3xl opacity-75"
    ></div>

    <div
      class="absolute -top-24 -right-24 sm:-top-32 sm:-right-32 h-64 w-64 sm:h-96 sm:w-96 rounded-full bg-linear-to-bl from-[#e0ecfe]/40 to-transparent blur-3xl opacity-50"
    ></div>
  </div>

  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col items-center text-center">
    <div
      class="inline-flex items-center gap-2 rounded-full border border-[#93c5fd]/70 bg-[#eff6ff]/80 px-4.5 py-1.5 sm:px-5 sm:py-1.5 text-[11px] sm:text-[12.5px] font-semibold uppercase tracking-wider text-[#1d64ec] shadow-2xs backdrop-blur-xs mb-5 sm:mb-7 transition-colors"
    >
      <span>{{ 'HERO.BADGE' | translate }}</span>
    </div>

    <h1
      class="font-inter font-extrabold text-[#182849] text-[30px] sm:text-[38px] md:text-[56px] lg:text-[66px] xl:text-[76px] leading-[1.14] sm:leading-[1.08] md:leading-[1.04] tracking-[-0.035em] max-w-6xl mb-4 sm:mb-5"
    >
      <span class="block md:whitespace-nowrap">{{ 'HERO.TITLE_LINE_1' | translate }}</span>
      <span class="block md:whitespace-nowrap">
        <span>{{ 'HERO.TITLE_LINE_2_PREFIX' | translate }}</span>
        <span class="text-[#1d64ec]">{{ 'HERO.TITLE_LINE_2_HIGHLIGHT' | translate }}</span>
      </span>
    </h1>

    <p
      class="font-dm-sans font-normal text-[#182849]/80 text-[15px] sm:text-[16.5px] md:text-[17.5px] lg:text-[18.5px] leading-relaxed max-w-4xl md:whitespace-nowrap"
    >
      {{ 'HERO.SUBTITLE' | translate }}
    </p>

    <div class="mt-6 sm:mt-7 flex flex-col sm:flex-row items-center justify-center gap-3.5 sm:gap-4 w-full sm:w-auto">
      <button
        type="button"
        (click)="onContact()"
        [attr.aria-label]="'HERO.ARIA.CONTACT_US' | translate"
        class="group relative overflow-hidden w-full sm:w-auto inline-flex items-center justify-center px-6.5 py-2.5 sm:px-7 sm:py-2.5 rounded-xl bg-linear-to-r from-[#1d44eb] via-[#2563eb] to-[#3b82f6] text-white font-display text-[15px] sm:text-xl font-semibold shadow-xs hover:shadow-md active:scale-[0.98] transition-all duration-300 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#1d44eb] cursor-pointer before:absolute before:inset-0 before:bg-linear-to-r before:from-[#1738c2] before:via-[#1e4ed8] before:to-[#2563eb] before:opacity-0 hover:before:opacity-100 before:transition-opacity before:duration-300 motion-reduce:before:transition-none"
      >
        <span class="relative z-10">{{ 'HERO.ACTIONS.CONTACT_US' | translate }}</span>
      </button>

      <button
        type="button"
        (click)="onWatchVideo()"
        [attr.aria-label]="'HERO.ARIA.WATCH_VIDEO' | translate"
        class="group relative overflow-hidden w-full sm:w-auto inline-flex items-center justify-center px-6.5 py-2.5 sm:px-7 sm:py-2.5 rounded-xl border border-transparent bg-origin-border [background-clip:padding-box,border-box] bg-[linear-gradient(white,white),linear-gradient(to_right,#1d44eb,#3b82f6)] font-display text-[15px] sm:text-xl font-semibold shadow-2xs hover:shadow-xs active:scale-[0.98] transition-all duration-300 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#1d44eb] cursor-pointer before:absolute before:inset-0 before:bg-[#1d44eb]/6 before:opacity-0 hover:before:opacity-100 before:transition-opacity before:duration-300 motion-reduce:before:transition-none"
      >
        <span class="relative z-10 bg-linear-to-r from-[#1d44eb] to-[#3b82f6] bg-clip-text text-transparent">
          {{ 'HERO.ACTIONS.WATCH_VIDEO' | translate }}
        </span>
      </button>
    </div>

    <div class="mt-10 sm:mt-14 md:mt-16 w-full max-w-6xl xl:max-w-7xl">
      <app-ui-mockup />
    </div>
  </div>
</section>
