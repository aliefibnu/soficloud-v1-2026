<section
  [id]="sectionId()"
  [attr.aria-labelledby]="sectionId() + '-heading'"
  class="w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-5 sm:py-7 lg:py-8 scroll-mt-8 sm:scroll-mt-12 lg:scroll-mt-16"
>
  <div
    class="w-full rounded-3xl bg-white shadow-[0_8px_30px_rgba(35,36,78,0.08)] overflow-hidden border border-gray-100/70"
  >
    <div class="px-6 py-7 sm:px-10 sm:py-8 lg:px-10 lg:py-9 text-center max-w-5xl mx-auto">
      <h3
        [id]="sectionId() + '-heading'"
        class="font-inter font-semibold text-2xl sm:text-3xl md:text-4xl lg:text-[46px] text-[#23244E] leading-tight lg:leading-[1.18] tracking-normal text-center max-w-3xl lg:max-w-214 mx-auto whitespace-pre-line"
        style="font-family: var(--font-inter, 'Inter Variable', sans-serif); font-weight: 600"
      >
        {{ title() }}
      </h3>

      <div
        class="w-full max-w-214 h-0.5 bg-[#365AD2] mx-auto my-4 sm:my-5"
        aria-hidden="true"
      ></div>

      <p
        class="font-dm-sans font-normal text-[#23244E] text-[14px] leading-relaxed sm:leading-[1.65] text-center max-w-214 mx-auto mt-4 sm:mt-5 tracking-normal whitespace-pre-line"
        style="font-family: var(--font-dm-sans, 'DM Sans Variable', sans-serif); font-weight: 400"
      >
        {{ description() }}
      </p>
    </div>

    <div [class]="'w-full ' + stageBgClass()">
      <div
        [class]="'w-full max-w-[1161px] mx-auto p-3.5 sm:p-5 lg:pt-[50px] lg:pb-[50.28px] flex items-center justify-center gap-4 ' + (decisionReversed() ? 'lg:pl-[39px] lg:pr-[39.5px] lg:gap-[17px] flex-col-reverse lg:flex-row-reverse' : 'lg:pl-[52.06px] lg:pr-[26.07px] lg:gap-[17.5px] flex-col lg:flex-row')"
      >
        <div class="w-full lg:w-auto shrink-0 flex justify-center">
          <ng-content />
        </div>

        <div
          class="w-full sm:w-auto lg:w-[160px] lg:h-[352px] shrink-0 bg-white rounded-[8px] pt-6 px-[16.5px] pb-4 shadow-[0_3px_15px_rgba(0,0,0,0.08)] border border-black/5 flex flex-col self-center"
        >
          <div class="w-[127px] h-32 lg:h-[108px] rounded-lg bg-[#D9D9D9] shrink-0 mx-auto" aria-hidden="true"></div>

          <div class="flex flex-col mt-5 w-full">
            <span
              class="font-dm-sans font-bold text-[15px] text-[#23244E] leading-snug tracking-tight max-w-[127px]"
              style="
                font-family: var(--font-dm-sans, 'DM Sans Variable', sans-serif);
                font-weight: 700;
              "
            >
              {{ decisionLabel() }}
            </span>
            <p
              class="font-dm-sans font-regular font-normal text-[12.5px] text-[#23244E] leading-[1.6] mt-2 max-w-[127px]"
              style="
                font-family: var(--font-dm-sans, 'DM Sans Variable', sans-serif);
                font-weight: 400;
              "
            >
              {{ decisionText() }}
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
