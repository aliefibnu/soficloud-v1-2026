<section
  id="visibility-function"
  class="relative w-full pt-8 sm:pt-12 lg:pt-16 pb-4 sm:pb-6 lg:pb-8 px-4 sm:px-6 lg:px-8"
  aria-labelledby="visibility-function-heading"
>
  <div class="max-w-7xl mx-auto">
    <div class="text-center max-w-4xl mx-auto mb-8 sm:mb-10 lg:mb-12 px-2">
      <h2
        id="visibility-function-heading"
        class="font-inter font-bold text-[#23244E] text-2xl sm:text-3xl md:text-4xl lg:text-[46px] leading-none tracking-normal text-center"
        style="
          font-family: var(--font-inter, 'Inter Variable', sans-serif);
          font-weight: 700;
        "
      >
        {{ 'BUSINESS_REALTIME.VISIBILITY_FUNCTION.TITLE' | translate }}
      </h2>

      <p
        class="font-dm-sans font-normal text-[#23244E] text-[17px] leading-relaxed text-center max-w-210 mx-auto mt-4 sm:mt-5"
        style="
          font-family: var(--font-dm-sans, 'DM Sans Variable', sans-serif);
          font-weight: 400;
        "
      >
        {{ 'BUSINESS_REALTIME.VISIBILITY_FUNCTION.SUBTITLE' | translate }}
      </p>
    </div>

    <div #tabsSentinelRef class="w-full h-0 pointer-events-none"></div>

    <div
      class="w-full transition-[padding] duration-300 ease-out"
      [class.fixed]="isSticky()"
      [class.top-[68px]]="isSticky()"
      [class.sm:top-[72px]]="isSticky()"
      [class.lg:top-[76px]]="isSticky()"
      [class.left-0]="isSticky()"
      [class.right-0]="isSticky()"
      [class.z-30]="isSticky()"
      [class.px-4]="!isSticky()"
      [class.sm:px-6]="!isSticky()"
      [class.lg:px-8]="!isSticky()"
      [class.px-0]="isSticky()"
    >
      <div class="max-w-7xl mx-auto flex justify-center">
        <div
          class="w-full pt-2 pb-2.5 sm:pb-3 transition-[max-width,background-color,box-shadow,border-radius] duration-300 ease-out shadow-none"
          [class.max-w-7xl]="!isSticky()"
          [class.lg:max-w-310]="!isSticky()"
          [class.max-w-5xl]="isSticky()"
          [class.bg-white]="isSticky()"
          [class.rounded-b-[24px]]="isSticky()"
          [class.shadow-dynamic-island]="isSticky()"
          [style.box-shadow]="
            isSticky()
              ? 'var(--shadow-dynamic-island, 0 14px 34px -4px rgba(24, 40, 73, 0.18), 0 6px 14px -2px rgba(24, 40, 73, 0.10))'
              : 'none'
          "
        >
          <div
            class="w-full overflow-x-auto scrollbar-none [&::-webkit-scrollbar]:hidden xl:overflow-visible"
          >
            <div class="min-w-270 xl:min-w-0 w-full relative">
              <div
                #tabsListRef
                role="tablist"
                aria-label="Cross-functional visibility options"
                class="relative flex items-center justify-between w-full px-6 sm:px-10 lg:px-17.5"
              >
                @for (tab of tabs; track tab.id; let i = $index) {
                  <button
                    type="button"
                    role="tab"
                    [id]="'tab-' + tab.id"
                    [attr.data-tab-id]="tab.id"
                    [attr.aria-selected]="activeTabId() === tab.id"
                    [attr.aria-controls]="tab.id"
                    [attr.tabindex]="activeTabId() === tab.id ? 0 : -1"
                    (click)="selectTab(tab.id)"
                    (keydown)="onTabKeydown($event, i)"
                    class="font-dm-sans font-bold leading-none tracking-normal text-center transition-colors duration-200 cursor-pointer select-none whitespace-nowrap shrink-0 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#365AD2] focus-visible:ring-offset-2 rounded-sm text-[10px] sm:text-xs md:text-[13px] lg:text-sm py-2 px-2.5"
                    [class.text-[#23244E]]="activeTabId() === tab.id"
                    [class.text-[#B1B1B1DD]]="activeTabId() !== tab.id"
                    [style.font-family]="'var(--font-dm-sans, \'DM Sans Variable\', sans-serif)'"
                    [style.font-weight]="700"
                    [style.color]="activeTabId() === tab.id ? '#23244E' : '#B1B1B1DD'"
                  >
                    {{ tab.titleKey | translate }}
                  </button>
                }
              </div>

              <div class="w-full px-6 sm:px-10 lg:px-17.5 mt-1.5">
                <div class="relative w-full h-0.75 bg-[#D9D9D9] overflow-hidden rounded-full">
                  <span
                    class="absolute top-0 h-0.75 bg-[#365AD2] rounded-full"
                    [class.transition-[left,width]]="!isStickyTransitioning()"
                    [class.duration-300]="!isStickyTransitioning()"
                    [class.ease-out]="!isStickyTransitioning()"
                    [style.left.px]="indicatorLeft()"
                    [style.width.px]="indicatorWidth()"
                  ></span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    @if (isSticky()) {
      <div class="w-full h-12 sm:h-13.5 lg:h-15" aria-hidden="true"></div>
    }
  </div>
</section>
