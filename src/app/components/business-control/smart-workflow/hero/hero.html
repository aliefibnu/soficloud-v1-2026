<section id="hero" class="relative w-full py-3 sm:py-4 lg:py-6 px-4 sm:px-6 lg:px-8">
  <div class="max-w-[1360px] mx-auto">
    <div
      class="relative w-full rounded-3xl lg:rounded-[32px] overflow-hidden shadow-[0px_3px_15px_0px_rgba(0,0,0,0.08)] lg:aspect-[1360/762] min-h-[500px] lg:min-h-0 flex flex-col lg:flex-row items-center justify-between"
      style="
        background: conic-gradient(
          from 19.5deg at 53.25% 48.04%,
          #fdfdfd -157.5deg,
          rgba(235, 242, 253, 0.9) 74.42deg,
          #fdfdfd 202.5deg,
          rgba(235, 242, 253, 0.9) 434.42deg
        );
      "
    >
      <!-- Left Column: Typography -->
      <div
        class="w-full lg:w-[48%] lg:max-w-[650px] h-full flex flex-col justify-center px-6 py-8 sm:px-10 sm:py-10 lg:py-0 lg:pl-[63.5px] lg:pr-2 z-10 select-text"
      >
        <h1
          class="font-inter font-extrabold text-[#23244E] text-[32px] sm:text-[40px] md:text-[48px] lg:text-[clamp(36px,4.44vw,64px)] leading-[1.25] tracking-normal max-w-[590px]"
          style="font-family: var(--font-inter, 'Inter Variable', sans-serif); font-weight: 800"
        >
          <span class="block whitespace-nowrap">{{ 'SMART_WORKFLOW.HERO.TITLE_LINE_1' | translate }}</span>
          <span class="block whitespace-nowrap">{{ 'SMART_WORKFLOW.HERO.TITLE_LINE_2' | translate }}</span>
          <span class="block whitespace-nowrap">{{ 'SMART_WORKFLOW.HERO.TITLE_LINE_3' | translate }}</span>
        </h1>

        <p
          class="font-dm-sans font-normal text-[#23244E] text-[13px] sm:text-[14px] leading-[1.6] text-justify max-w-[504px] mt-3 sm:mt-4 lg:mt-[18px]"
          style="
            font-family: var(--font-dm-sans, 'DM Sans Variable', sans-serif);
            font-weight: 400;
          "
        >
          {{ 'SMART_WORKFLOW.HERO.DESCRIPTION' | translate }}
        </p>
      </div>

      <!-- Right Column: Tablet Stage (Meja Pedestal + Approval Mockup Tablet) -->
      <div
        class="w-full lg:w-[60.66%] h-auto lg:h-full relative lg:absolute lg:top-0 lg:-right-[4.78%] flex items-end justify-end pointer-events-none select-none overflow-hidden"
      >
        <div class="relative w-full aspect-[825/762]">
          <img
            ngSrc="/images/smart-workflow/hero-pedestal.svg"
            width="825"
            height="287"
            alt=""
            aria-hidden="true"
            draggable="false"
            class="pointer-events-none absolute bottom-0 left-0 w-full h-[37.664%] object-cover object-bottom select-none z-0"
          />
          <img
            ngSrc="/images/smart-workflow/hero-tablet.svg"
            width="686"
            height="487"
            priority
            draggable="false"
            [alt]="'SMART_WORKFLOW.HERO.TABLET_ALT' | translate"
            class="pointer-events-none absolute left-[10.788%] top-[16.142%] w-[83.152%] h-auto object-contain select-none z-10"
          />
        </div>
      </div>
    </div>
  </div>
</section>
