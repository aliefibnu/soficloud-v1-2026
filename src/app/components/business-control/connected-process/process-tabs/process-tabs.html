<section
  id="process-tabs"
  class="relative w-full transition-all duration-300 ease-in-out"
  [class.py-6]="!isSticky()"
  [class.sm:py-8]="!isSticky()"
  [class.lg:py-10]="!isSticky()"
  [class.px-4]="!isSticky()"
  [class.sm:px-6]="!isSticky()"
  [class.lg:px-8]="!isSticky()"
  [class.py-0]="isSticky()"
  [class.px-0]="isSticky()"
  aria-label="Connected process navigation"
>
  <div class="max-w-7xl mx-auto flex justify-center">
    <!-- Outer container: transforms into dynamic island when sticky -->
    <div
      class="w-full transition-all duration-300 ease-in-out shadow-none"
      [class.max-w-7xl]="!isSticky()"
      [class.lg:max-w-310]="!isSticky()"
      [class.max-w-5xl]="isSticky()"
      [class.bg-white]="isSticky()"
      [class.rounded-b-[24px]]="isSticky()"
      [class.shadow-dynamic-island]="isSticky()"
      [style.box-shadow]="
        isSticky()
          ? 'var(--shadow-dynamic-island, 0 14px 34px -4px rgba(24, 40, 73, 0.18), 0 6px 14px -2px rgba(24, 40, 73, 0.10))'
          : 'none'
      "
      [class.pt-1]="isSticky()"
      [class.pb-2.5]="isSticky()"
      [class.sm:pb-3]="isSticky()"
    >
      <div
        class="w-full overflow-x-auto scrollbar-none [&::-webkit-scrollbar]:hidden xl:overflow-visible"
        [class.pb-2]="!isSticky()"
      >
        <div class="min-w-270 xl:min-w-0 w-full relative">
          <div
            #tabsListRef
            role="tablist"
            aria-label="Connected process milestones"
            class="relative flex items-center justify-between w-full px-6 sm:px-10 lg:px-17.5"
          >
            @for (tab of tabs; track tab.id; let i = $index) {
              <button
                type="button"
                role="tab"
                [id]="'tab-' + tab.id"
                [attr.data-tab-id]="tab.id"
                [attr.aria-selected]="activeTabId() === tab.id"
                [attr.aria-controls]="tab.id"
                [attr.tabindex]="activeTabId() === tab.id ? 0 : -1"
                (click)="selectTab(tab.id)"
                (keydown)="onTabKeydown($event, i)"
                class="font-dm-sans font-bold leading-none tracking-normal text-center transition-colors duration-200 cursor-pointer select-none whitespace-nowrap shrink-0 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#365AD2] focus-visible:ring-offset-2 rounded-sm"
                [class.text-[7px]]="!isSticky()"
                [class.sm:text-[10px]]="!isSticky()"
                [class.md:text-xs]="!isSticky()"
                [class.lg:text-sm]="!isSticky()"
                [class.py-2.5]="!isSticky()"
                [class.px-2]="!isSticky()"
                [class.text-[10px]]="isSticky()"
                [class.sm:text-xs]="isSticky()"
                [class.md:text-[13px]]="isSticky()"
                [class.lg:text-[14px]]="isSticky()"
                [class.py-2]="isSticky()"
                [class.px-2.5]="isSticky()"
                [class.text-[#23244E]]="activeTabId() === tab.id"
                [class.text-[#B1B1B1DD]]="activeTabId() !== tab.id"
                [style.font-family]="'var(--font-dm-sans, \'DM Sans Variable\', sans-serif)'"
                [style.font-weight]="700"
                [style.color]="activeTabId() === tab.id ? '#23244E' : '#B1B1B1DD'"
              >
                {{ tab.titleKey | translate }}
              </button>
            }
          </div>

          <!-- Indicator baseline track: precisely bounded within tab padding (0% to 100%) -->
          <div class="w-full px-6 sm:px-10 lg:px-17.5" [class.mt-2]="!isSticky()">
            <div class="relative w-full h-0.75 bg-[#D9D9D9] overflow-hidden rounded-full">
              <span
                class="absolute top-0 h-0.75 bg-[#365AD2] rounded-full transition-all duration-300 ease-out"
                [style.left.px]="indicatorLeft()"
                [style.width.px]="indicatorWidth()"
              ></span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
