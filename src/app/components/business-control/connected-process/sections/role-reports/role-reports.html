<app-process-section-shell
  sectionId="laporan"
  [title]="'CONNECTED_PROCESS.ROLE_REPORTS.TITLE' | translate"
  [description]="'CONNECTED_PROCESS.ROLE_REPORTS.DESCRIPTION' | translate"
  stageBgClass="bg-[linear-gradient(310.74deg,#FFEFED_-9.86%,rgba(252,190,182,0.8)_43.43%,#FBCBC5_94.33%)]"
  titleMaxWidthClass="max-w-xl sm:max-w-2xl lg:max-w-[620px]"
  descriptionMaxWidthClass="max-w-md sm:max-w-lg lg:max-w-[480px]"
>
  <div
    class="grid grid-cols-1 md:grid-cols-3 gap-3.5 sm:gap-4 lg:gap-4.5 xl:gap-5 w-full max-w-280 mx-auto py-4 sm:py-6 lg:py-8 justify-center"
  >
    @for (tier of tiers; track tier.id) {
      <article
        class="bg-white rounded-2xl p-4 lg:py-4 lg:px-4.5 shadow-[0_4px_24px_rgba(35,36,78,0.06)] border border-white/60 flex flex-row items-stretch gap-3 sm:gap-3.5 lg:gap-3.5 transition-all duration-300 hover:-translate-y-1 hover:shadow-[0_8px_32px_rgba(35,36,78,0.1)] min-h-78.5 lg:h-78.5 max-w-95 md:max-w-none mx-auto w-full"
      >
        <div
          class="w-18 sm:w-20 lg:w-21 shrink-0 flex flex-col items-center justify-center text-center self-center py-1 select-none"
        >
          <span
            class="font-dm-sans font-bold text-2xl sm:text-3xl lg:text-[36px] text-[#23244E] mb-1 sm:mb-1.5 tracking-tight select-none leading-none"
            style="
              font-family: var(--font-dm-sans, 'DM Sans Variable', sans-serif);
              font-weight: 700;
            "
          >
            {{ tier.number }}
          </span>
          <span
            class="font-dm-sans font-normal text-[10px] sm:text-[11px] tracking-wider uppercase text-[#23244E] leading-tight"
            style="
              font-family: var(--font-dm-sans, 'DM Sans Variable', sans-serif);
              font-weight: 400;
            "
          >
            {{ tier.titleKey | translate }}
          </span>
        </div>

        <div
          [class]="'w-[20.83px] rounded-lg self-stretch shrink-0 ' + tier.pillGradientClass"
          [style.background]="tier.pillGradient"
          aria-hidden="true"
        ></div>

        <div
          class="flex-1 min-w-0 flex flex-col justify-between pt-7 sm:pt-8 lg:pt-8 pb-1 sm:pb-1.5 pr-0.5"
        >
          <div>
            <h3
              class="font-dm-sans font-bold text-xl sm:text-2xl lg:text-[28px] text-[#23244E] leading-[1.2] lg:leading-[1.22] tracking-normal mb-2 sm:mb-2.5 whitespace-pre-line"
              style="
                font-family: var(--font-dm-sans, 'DM Sans Variable', sans-serif);
                font-weight: 700;
              "
            >
              {{ tier.subtitleKey | translate }}
            </h3>

            <p
              class="font-dm-sans font-normal text-[11px] sm:text-[11.5px] lg:text-[11.5px] text-[#23244E]/90 leading-[1.45] sm:leading-normal tracking-normal mb-2.5 sm:mb-3"
              style="
                font-family: var(--font-dm-sans, 'DM Sans Variable', sans-serif);
                font-weight: 400;
              "
            >
              {{ tier.descriptionKey | translate }}
            </p>
          </div>

          <ul
            class="space-y-0.5 sm:space-y-0.75 text-[11px] sm:text-[11.5px] font-dm-sans font-normal text-[#1C73E8]"
            aria-label="Department Tags"
          >
            @for (tag of asArray(tier.tagsKey | translate); track tag) {
              <li class="flex items-center gap-1.5 leading-none">
                <span class="text-[#1C73E8] select-none font-normal leading-none">·</span>
                <span class="leading-none">{{ tag }}</span>
              </li>
            }
          </ul>
        </div>
      </article>
    }
  </div>
</app-process-section-shell>
