<app-process-section-shell
  sectionId="satu-data"
  [title]="'CONNECTED_PROCESS.SATU_DATA.TITLE' | translate"
  [description]="'CONNECTED_PROCESS.SATU_DATA.DESCRIPTION' | translate"
  stageBgClass="bg-[linear-gradient(322.37deg,#EDF3FB_-7.13%,rgba(178,204,245,0.91)_36.2%,#C3D7F7_96.88%)]"
  stagePaddingClass="py-8 px-4 sm:py-10 sm:px-6 lg:py-12 lg:px-8 short:py-6"
>
  <div
    class="grid grid-cols-1 md:grid-cols-3 gap-4 sm:gap-5 lg:gap-6 xl:gap-8 w-full max-w-7xl mx-auto py-1"
  >
    @for (card of cards; track card.number) {
      <article
        class="bg-white rounded-[25.09px] px-4 py-5 sm:px-5 sm:py-6 lg:px-5.5 lg:py-6 xl:px-6 shadow-[0_4px_24px_rgba(35,36,78,0.06)] border border-white/60 flex flex-col items-center text-center justify-center transition-all duration-300 hover:-translate-y-1 hover:shadow-[0_8px_32px_rgba(35,36,78,0.1)] w-full max-w-85 md:max-w-none justify-self-center min-h-45 lg:h-50"
      >
        <span
          class="font-dm-sans font-bold text-xl sm:text-2xl lg:text-[28px] text-[#23244E] mb-1.5 sm:mb-2 tracking-tight select-none leading-none"
          style="font-family: var(--font-dm-sans, 'DM Sans Variable', sans-serif); font-weight: 700"
        >
          {{ card.number }}
        </span>
        <h3
          class="font-dm-sans font-bold text-base sm:text-lg lg:text-[18px] xl:text-[19px] text-[#23244E] mb-1.5 sm:mb-2 leading-snug tracking-tight w-full md:whitespace-nowrap"
          style="font-family: var(--font-dm-sans, 'DM Sans Variable', sans-serif); font-weight: 700"
        >
          {{ card.titleKey | translate }}
        </h3>
        <p
          class="font-dm-sans font-normal text-xs sm:text-[12.5px] lg:text-[13.5px] text-[#23244E] leading-relaxed tracking-normal max-w-70"
          style="font-family: var(--font-dm-sans, 'DM Sans Variable', sans-serif); font-weight: 400"
        >
          {{ card.descriptionKey | translate }}
        </p>
      </article>
    }
  </div>
</app-process-section-shell>
