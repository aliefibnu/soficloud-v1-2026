<app-process-section-shell
  sectionId="satu-data"
  [title]="'CONNECTED_PROCESS.SATU_DATA.TITLE' | translate"
  [description]="'CONNECTED_PROCESS.SATU_DATA.DESCRIPTION' | translate"
  stageBgClass="bg-[linear-gradient(232.37deg,#EDF3FB_-7.13%,rgba(178,204,245,0.91)_36.2%,#C3D7F7_96.88%)]"
>
  <div
    class="grid grid-cols-1 md:grid-cols-3 gap-6 sm:gap-7 lg:gap-8 xl:gap-10 max-w-6xl mx-auto py-6 sm:py-8 lg:py-12"
  >
    @for (card of cards; track card.number) {
      <article
        class="bg-white rounded-3xl sm:rounded-4xl lg:rounded-[32px] p-6 sm:p-8 lg:p-10 shadow-[0_4px_24px_rgba(35,36,78,0.06)] border border-white/60 flex flex-col items-center text-center justify-start transition-all duration-300 hover:-translate-y-1 hover:shadow-[0_8px_32px_rgba(35,36,78,0.1)]"
      >
        <span
          class="font-inter font-bold text-3xl sm:text-4xl lg:text-[40px] text-[#23244E] mb-3 sm:mb-4 tracking-tight select-none"
          style="
            font-family: var(--font-inter, 'Inter Variable', sans-serif);
            font-weight: 700;
          "
        >
          {{ card.number }}
        </span>
        <h3
          class="font-inter font-bold text-lg sm:text-xl lg:text-[22px] text-[#23244E] mb-3 sm:mb-4 leading-snug tracking-tight max-w-72"
          style="
            font-family: var(--font-inter, 'Inter Variable', sans-serif);
            font-weight: 700;
          "
        >
          {{ card.titleKey | translate }}
        </h3>
        <p
          class="font-dm-sans font-normal text-sm sm:text-[15px] lg:text-[16px] text-[#23244E]/85 leading-relaxed tracking-normal max-w-72"
          style="
            font-family: var(--font-dm-sans, 'DM Sans Variable', sans-serif);
            font-weight: 400;
          "
        >
          {{ card.descriptionKey | translate }}
        </p>
      </article>
    }
  </div>
</app-process-section-shell>
