<button
  type="button"
  data-scroll-to-top="true"
  (click)="scrollToHero()"
  [attr.aria-label]="'COMMON.BACK_TO_TOP' | translate"
  [class]="
    'group fixed bottom-6 right-6 sm:bottom-8 sm:right-8 z-50 flex items-center justify-center w-12 h-12 sm:w-13 sm:h-13 rounded-full bg-linear-to-r from-[#1D3FE0] to-[#4F8CEB] text-white shadow-lg shadow-blue-600/30 hover:shadow-xl hover:shadow-blue-600/40 hover:brightness-105 active:scale-95 transition-all duration-300 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#1D3FE0] cursor-pointer ' +
    (isVisible()
      ? 'opacity-100 scale-100 pointer-events-auto'
      : 'opacity-0 scale-90 pointer-events-none')
  "
>
  <img
    ngSrc="/images/scroll-to-top/Vector.svg"
    alt=""
    aria-hidden="true"
    width="30"
    height="37"
    class="w-[18px] h-auto sm:w-[21px] transition-transform duration-200 group-hover:-translate-y-0.5 select-none pointer-events-none"
  />
</button>
