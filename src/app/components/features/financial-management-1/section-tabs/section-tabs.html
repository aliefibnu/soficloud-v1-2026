<div
  id="financial-management-tabs"
  class="relative w-full py-0 transition-[padding] duration-300 ease-out"
  [class.px-4]="!isSticky()"
  [class.sm:px-6]="!isSticky()"
  [class.lg:px-8]="!isSticky()"
  [class.px-0]="isSticky()"
>
  <div class="max-w-7xl mx-auto flex justify-center">
    <!-- Outer container: transforms into dynamic island when sticky with constant vertical height -->
    <div
      class="w-full pt-2 pb-2.5 sm:pb-3 transition-[max-width,background-color,box-shadow,border-radius] duration-300 ease-out shadow-none"
      [class.max-w-7xl]="!isSticky()"
      [class.lg:max-w-310]="!isSticky()"
      [class.max-w-5xl]="isSticky()"
      [class.bg-white]="isSticky()"
      [class.rounded-b-[24px]]="isSticky()"
      [class.shadow-dynamic-island]="isSticky()"
      [style.box-shadow]="
        isSticky()
          ? 'var(--shadow-dynamic-island, 0 14px 34px -4px rgba(24, 40, 73, 0.18), 0 6px 14px -2px rgba(24, 40, 73, 0.10))'
          : 'none'
      "
    >
      <nav [attr.aria-label]="navAriaLabel()" class="relative w-full">
        <div
          class="w-full overflow-x-auto scrollbar-none [&::-webkit-scrollbar]:hidden xl:overflow-visible"
        >
          <div [class]="listMinWidthClass() + ' w-full relative'">
            <ul
              #tabsListRef
              class="tabs-list relative flex items-center justify-between w-full m-0 px-6 sm:px-10 lg:px-17.5"
            >
              @for (tab of tabs(); track tab.id) {
                <li class="shrink-0 list-none">
                  <a
                    [id]="'tab-' + tab.id"
                    [href]="getTabHref(tab.id)"
                    [attr.data-tab-id]="tab.id"
                    [attr.aria-current]="activeTabId() === tab.id ? 'true' : null"
                    (click)="onTabClick($event, tab.id)"
                    class="tab-link inline-flex items-center justify-center py-2 px-2.5 font-dm-sans font-bold leading-none tracking-normal text-center uppercase transition-colors duration-200 cursor-pointer select-none whitespace-nowrap shrink-0 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#365AD2] focus-visible:ring-offset-2 rounded-sm text-[10px] sm:text-xs md:text-[13px] lg:text-sm"
                    [class.text-[#23244E]]="activeTabId() === tab.id"
                    [class.text-[#B1B1B1DD]]="activeTabId() !== tab.id"
                    [class.hover:text-[#23244E]]="activeTabId() !== tab.id"
                  >
                    {{ tab.titleKey ? (tab.titleKey | translate) : tab.defaultTitle }}
                  </a>
                </li>
              }
            </ul>

            <!-- Indicator baseline track: precisely bounded within tab padding (0% to 100%) -->
            <div class="w-full px-6 sm:px-10 lg:px-17.5 mt-1.5">
              <div class="relative w-full h-0.75 bg-[#D9D9D9] overflow-hidden rounded-full">
                <span
                  class="tab-indicator absolute top-0 h-0.75 bg-[#365AD2] rounded-full"
                  [class.transition-[left,width]]="!isStickyTransitioning()"
                  [class.duration-300]="!isStickyTransitioning()"
                  [class.ease-out]="!isStickyTransitioning()"
                  [style.left.px]="indicatorLeft()"
                  [style.width.px]="indicatorWidth()"
                ></span>
              </div>
            </div>
          </div>
        </div>
      </nav>
    </div>
  </div>
</div>
