<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 212 145" fill="none" class="bm-illustration bm-services w-full h-auto">
  <defs>
    <style>
      @keyframes bm-spin-cw {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes bm-spin-ccw {
        from { transform: rotate(0deg); }
        to { transform: rotate(-360deg); }
      }
      @keyframes bm-wrench-turn {
        0%, 100% { transform: rotate(0deg); }
        30% { transform: rotate(14deg); }
        70% { transform: rotate(-8deg); }
      }
      @keyframes bm-briefcase-bounce {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.015); }
      }
      .bm-illustration:hover .bm-gear-1,
      :root:hover .bm-gear-1,
      .group:hover .bm-gear-1 {
        animation: bm-spin-cw 3.5s linear infinite;
      }
      .bm-illustration:hover .bm-gear-2,
      :root:hover .bm-gear-2,
      .group:hover .bm-gear-2 {
        animation: bm-spin-ccw 2.5s linear infinite;
      }
      .bm-illustration:hover .bm-gear-3,
      :root:hover .bm-gear-3,
      .group:hover .bm-gear-3 {
        animation: bm-spin-cw 2.0s linear infinite;
      }
      .bm-illustration:hover .bm-wrench,
      :root:hover .bm-wrench,
      .group:hover .bm-wrench {
        animation: bm-wrench-turn 1.4s ease-in-out infinite;
      }
      .bm-illustration:hover .bm-briefcase,
      :root:hover .bm-briefcase,
      .group:hover .bm-briefcase {
        animation: bm-briefcase-bounce 2s ease-in-out infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        .bm-gear-1, .bm-gear-2, .bm-gear-3, .bm-wrench, .bm-briefcase {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <!-- Backdrop -->
  <rect x="8" y="0" width="196" height="145" rx="26" fill="#C4D8F5"/>

  <!-- Briefcase -->
  <g class="bm-briefcase" style="transform-origin: 100px 85px;">
    <!-- Handle -->
    <rect x="74" y="10" width="56" height="24" rx="6" fill="#365AD2"/>
    <rect x="84" y="18" width="36" height="16" rx="4" fill="#C4D8F5"/>
    <rect x="71" y="28" width="8" height="6" rx="1.5" fill="#1E74D9"/>
    <rect x="123" y="28" width="8" height="6" rx="1.5" fill="#1E74D9"/>

    <!-- Briefcase Body -->
    <rect x="25" y="32" width="151" height="106" rx="10" fill="#1E74D9"/>

    <!-- Envelope Flap (White with horizontal shoulders) -->
    <polygon points="25,37 176,37 176,56 112,82 89,82 25,56" fill="#FFFFFF"/>
    <!-- Subtle shadow line under flap -->
    <polygon points="25,56 89,82 112,82 176,56 176,58 112,84 89,84 25,58" fill="#EBF2FD"/>

    <!-- Metal Clasp / Latch -->
    <rect x="91" y="72" width="20" height="26" rx="3" fill="#619AEA"/>
    <rect x="93" y="75" width="16" height="9" rx="2" fill="#FFFFFF"/>
    <rect x="94" y="87" width="14" height="7" rx="2" fill="#EBF2FD"/>
  </g>

  <!-- Gears Cluster (Top Left) -->
  <g id="services-gears">
    <!-- Gear 1 -->
    <g class="bm-gear-1" style="transform-origin: 22px 35px;">
      <path d="M 34.74 37.58 L 38.76 41.56 L 36.27 45.97 L 30.79 44.58 L 29.18 45.84 L 29.22 51.49 L 24.33 52.85 L 21.44 47.99 L 19.42 47.74 L 15.44 51.76 L 11.03 49.27 L 12.42 43.79 L 11.16 42.18 L 5.51 42.22 L 4.15 37.33 L 9.01 34.44 L 9.26 32.42 L 5.24 28.44 L 7.73 24.03 L 13.21 25.42 L 14.82 24.16 L 14.78 18.51 L 19.67 17.15 L 22.56 22.01 L 24.58 22.26 L 28.56 18.24 L 32.97 20.73 L 31.58 26.21 L 32.84 27.82 L 38.49 27.78 L 39.85 32.67 L 34.99 35.56 Z" fill="#CB1C29"/>
      <circle cx="22" cy="35" r="7" fill="#FFC0B9"/>
      <circle cx="22" cy="35" r="4.5" fill="none" stroke="#CB1C29" stroke-width="1.2"/>
    </g>

    <!-- Gear 2 -->
    <g class="bm-gear-2" style="transform-origin: 45px 44px;">
      <path d="M 52.90 48.31 L 54.68 52.67 L 50.81 55.63 L 47.08 52.76 L 45.21 53.00 L 42.33 56.72 L 37.83 54.85 L 38.46 50.18 L 37.31 48.68 L 32.65 48.05 L 32.02 43.22 L 36.38 41.42 L 37.10 39.69 L 35.32 35.33 L 39.19 32.37 L 42.92 35.24 L 44.79 35.00 L 47.67 31.28 L 52.17 33.15 L 51.54 37.82 L 52.69 39.32 L 57.35 39.95 L 57.98 44.78 L 53.62 46.58 Z" fill="#CB1C29"/>
      <circle cx="45" cy="44" r="5" fill="#FFC0B9"/>
    </g>

    <!-- Gear 3 -->
    <g class="bm-gear-3" style="transform-origin: 34px 57px;">
      <path d="M 40.97 57.70 L 43.46 60.24 L 41.60 63.50 L 38.14 62.64 L 36.88 63.38 L 35.92 66.81 L 32.17 66.83 L 31.18 63.41 L 29.91 62.68 L 26.46 63.57 L 24.57 60.33 L 27.04 57.76 L 27.03 56.30 L 24.54 53.76 L 26.40 50.50 L 29.86 51.36 L 31.12 50.62 L 32.08 47.19 L 35.83 47.17 L 36.82 50.59 L 38.09 51.32 L 41.54 50.43 L 43.43 53.67 L 40.96 56.24 Z" fill="#CB1C29"/>
      <circle cx="34" cy="57" r="3.5" fill="#FFC0B9"/>
    </g>
  </g>

  <!-- Wrench / Spanner (Foreground Right, Animated) -->
  <g class="bm-wrench" style="transform-origin: 170px 122.5px;">
    <!-- Wrench Red Body with Circular Loop Hole -->
    <path fill="#CB1C29" fill-rule="evenodd" d="M 183.49 45.74 C 183.87 44.22, 185.01 43.65, 186.34 43.65 C 187.10 43.65, 187.67 43.84, 187.67 44.60 L 187.67 49.92 L 192.61 52.58 L 196.79 49.92 L 196.79 42.89 C 196.79 42.32, 197.36 42.13, 197.93 42.13 C 198.50 42.13, 198.88 42.32, 199.07 42.51 C 209.71 47.26, 209.71 59.80, 202.11 65.50 C 200.59 66.64, 196.41 68.16, 194.70 69.30 L 177.41 122.50 A 7.41 7.41 0 0 1 162.59 122.50 L 183.87 65.50 C 178.85 59.80, 178.85 51.44, 183.49 45.74 Z M 170.00 118.13 A 4.37 4.37 0 1 0 170.00 126.87 A 4.37 4.37 0 1 0 170.00 118.13 Z"/>
    <!-- Pink Handle Shaft -->
    <path fill="#FFC0B9" d="M 187.10 67.40 L 191.66 68.92 L 175.51 116.80 A 7.60 7.60 0 0 0 169.24 114.90 Z"/>
    <!-- Three Grooves / Knurl Slots on Wrench Head -->
    <path fill="#FFEFED" d="M 184.07 56.17 A 1.04 1.04 0 0 1 186.14 55.88 L 186.94 61.53 A 1.04 1.04 0 0 1 184.87 61.82 Z M 187.19 56.06 A 1.04 1.04 0 0 1 189.26 55.77 L 190.05 61.41 A 1.04 1.04 0 0 1 187.98 61.70 Z M 190.34 55.95 A 1.04 1.04 0 0 1 192.41 55.65 L 193.21 61.30 A 1.04 1.04 0 0 1 191.14 61.59 Z"/>
  </g>
</svg>