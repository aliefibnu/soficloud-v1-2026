<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 189 181" fill="none" class="bm-illustration bm-construction w-full h-auto">
  <defs>
    <style>
      @keyframes bm-crane-sway {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(0.8deg); }
      }
      @keyframes bm-crane-hoist {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-12px); }
      }
      @keyframes bm-barrier-pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.03); }
      }
      .bm-illustration:hover .bm-crane-arm,
      :root:hover .bm-crane-arm,
      .group:hover .bm-crane-arm {
        animation: bm-crane-sway 2.5s ease-in-out infinite;
      }
      .bm-illustration:hover .bm-crane-hook,
      :root:hover .bm-crane-hook,
      .group:hover .bm-crane-hook {
        animation: bm-crane-hoist 2.2s ease-in-out infinite;
      }
      .bm-illustration:hover .bm-barrier,
      :root:hover .bm-barrier,
      .group:hover .bm-barrier {
        animation: bm-barrier-pulse 1.8s ease-in-out infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        .bm-crane-arm, .bm-crane-hook, .bm-barrier {
          animation: none !important;
        }
      }
    </style>
    <!-- Stripe pattern for hazard barrier: Peach and White diagonal stripes -->
    <pattern id="barrier-stripes" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="4" height="8" fill="#FFC0B9"/>
      <rect x="4" width="4" height="8" fill="#FFFFFF"/>
    </pattern>
  </defs>

  <!-- Backdrop -->
  <rect x="0" y="36" width="189" height="145" rx="26" fill="#C4D8F5"/>

  <!-- Multistory Construction Building -->
  <g id="building">
    <rect x="66" y="38" width="87" height="142" rx="4" fill="#1E74D9"/>
    <!-- Left vertical white column -->
    <rect x="77" y="48" width="8" height="122" rx="4" fill="#FFFFFF"/>

    <!-- 6 Floor window sections -->
    <!-- Floor 1 -->
    <rect x="98" y="49" width="46" height="14" rx="3" fill="#FFFFFF"/>
    <rect x="107" y="49" width="7" height="14" rx="2" fill="#619AEA"/>
    <rect x="125" y="49" width="7" height="14" rx="2" fill="#619AEA"/>

    <!-- Floor 2 -->
    <rect x="98" y="69" width="46" height="14" rx="3" fill="#FFFFFF"/>
    <rect x="107" y="69" width="7" height="14" rx="2" fill="#619AEA"/>
    <rect x="125" y="69" width="7" height="14" rx="2" fill="#619AEA"/>

    <!-- Floor 3 -->
    <rect x="98" y="89" width="46" height="14" rx="3" fill="#FFFFFF"/>
    <rect x="107" y="89" width="7" height="14" rx="2" fill="#619AEA"/>
    <rect x="125" y="89" width="7" height="14" rx="2" fill="#619AEA"/>

    <!-- Floor 4 -->
    <rect x="98" y="109" width="46" height="14" rx="3" fill="#FFFFFF"/>
    <rect x="107" y="109" width="7" height="14" rx="2" fill="#619AEA"/>
    <rect x="125" y="109" width="7" height="14" rx="2" fill="#619AEA"/>

    <!-- Floor 5 -->
    <rect x="98" y="129" width="46" height="14" rx="3" fill="#FFFFFF"/>
    <rect x="107" y="129" width="7" height="14" rx="2" fill="#619AEA"/>
    <rect x="125" y="129" width="7" height="14" rx="2" fill="#619AEA"/>

    <!-- Floor 6 -->
    <rect x="98" y="149" width="46" height="14" rx="3" fill="#FFFFFF"/>
    <rect x="107" y="149" width="7" height="14" rx="2" fill="#619AEA"/>
    <rect x="125" y="149" width="7" height="14" rx="2" fill="#619AEA"/>
  </g>

  <!-- Construction Crane -->
  <g id="crane">
    <!-- Crane Base Pedestal (Wider base stepped tiers) -->
    <rect x="13" y="170" width="52" height="10" rx="4" fill="#CB1C29"/>
    <rect x="18" y="164" width="42" height="7" rx="3" fill="#CB1C29"/>

    <!-- Crane Vertical Tower Mast -->
    <rect x="33" y="18" width="11" height="148" rx="2" fill="#CB1C29"/>

    <!-- Animated Boom & Hook -->
    <g class="bm-crane-arm" style="transform-origin: 38.5px 170px;">
      <!-- Peak Rounded Dome Top -->
      <path d="M 33 22 L 33 14 A 5.5 5.5 0 0 1 44 14 L 44 22 Z" fill="#CB1C29"/>

      <!-- Horizontal Jib / Boom -->
      <rect x="10" y="22" width="126" height="9" rx="4" fill="#CB1C29"/>
      <!-- Counterweight on left -->
      <rect x="9" y="20" width="8" height="13" rx="2" fill="#CB1C29"/>

      <!-- Trolley, Hoist Cable & Hook (Animated Vertically) -->
      <g class="bm-crane-hook" style="transform-origin: 104px 31px;">
        <!-- Trolley block on boom over the building -->
        <rect x="91" y="30" width="24" height="7" rx="2" fill="#CB1C29"/>
        <!-- Cable line -->
        <line x1="103" y1="37" x2="103" y2="70" stroke="#CB1C29" stroke-width="2"/>
        <!-- Hook -->
        <path d="M 103 70 C 103 74 99 76 97 73 C 95 70 98 67 100 68" fill="none" stroke="#CB1C29" stroke-width="2.5" stroke-linecap="round"/>
        <!-- Steel girder / load -->
        <rect x="87" y="73" width="32" height="5.5" rx="1.5" fill="#CB1C29"/>
      </g>
    </g>
  </g>

  <!-- Safety Barrier / Barricade (Foreground Right) -->
  <g class="bm-barrier" style="transform-origin: 158px 165px;">
    <!-- Red Upright Posts -->
    <rect x="138" y="147" width="7" height="33" rx="3.5" fill="#CB1C29"/>
    <rect x="168" y="147" width="7" height="33" rx="3.5" fill="#CB1C29"/>
    <rect x="135" y="177" width="13" height="3" rx="1.5" fill="#CB1C29"/>
    <rect x="165" y="177" width="13" height="3" rx="1.5" fill="#CB1C29"/>
    <!-- Rails with diagonal hazard stripes -->
    <rect x="134" y="151" width="46" height="7.5" rx="2" fill="url(#barrier-stripes)"/>
    <rect x="134" y="162" width="46" height="7.5" rx="2" fill="url(#barrier-stripes)"/>
  </g>
</svg>