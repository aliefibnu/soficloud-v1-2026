<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <!-- Main Blue Chevron Gradient -->
    <linearGradient id="blueGrad" x1="15%" y1="5%" x2="65%" y2="85%">
      <stop offset="0%" stop-color="#b8def8" />
      <stop offset="22%" stop-color="#68abd8" />
      <stop offset="55%" stop-color="#236896" />
      <stop offset="100%" stop-color="#063859" />
    </linearGradient>

    <!-- Red Bar Gradient -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#961419" />
      <stop offset="100%" stop-color="#69080c" />
    </linearGradient>

    <!-- Grey Bar Gradient -->
    <linearGradient id="greyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#999691" />
      <stop offset="100%" stop-color="#7f7c77" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="320" fill="#000000" />

  <!-- Left Logo Mark -->
  <g>
    <!-- Unified White Outer Contour -->
    <g fill="#ffffff" stroke="#ffffff" stroke-width="18" stroke-linejoin="round" stroke-linecap="round">
      <!-- Blue & Bevel Footprint -->
      <polygon points="41,28 157,148 35,275 39,174 70,143 37,112" />
      <!-- Red Bar Footprint -->
      <polygon points="69,240 144,162 159,177 69,273" />
      <!-- Grey Bar Footprint -->
      <polygon points="100,246 153,192 166,205 100,275" />
    </g>

    <!-- Inner White Spacer for Grey Bar -->
    <polygon points="100,246 153,192 166,205 100,275" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round" />

    <!-- Dark Blue Inner Bevel -->
    <polygon points="38,94 80,136 70,143 37,112" fill="#23435b" />

    <!-- Red Layered Bar -->
    <polygon points="69,240 144,162 159,177 69,273" fill="url(#redGrad)" />

    <!-- Main Blue Chevron -->
    <polygon points="41,28 157,148 35,275 39,174 79,136 38,94" fill="url(#blueGrad)" />

    <!-- Grey Layered Bar -->
    <polygon points="100,246 153,192 166,205 100,275" fill="url(#greyGrad)" />
  </g>

  <!-- Company Name Typography -->
  <g fill="#ffffff" font-family="&#39;Segoe UI&#39;, Calibri, &#39;Helvetica Neue&#39;, Arial, sans-serif">
    <!-- Top Line: PT. PERKASA INOVASI -->
    <text x="268" y="114" font-size="76" font-weight="400" letter-spacing="2.5">
      PT. PERKASA INOVASI
    </text>

    <!-- Bottom Line: LOGISTIK (with bold "TIK") -->
    <text x="260" y="262" font-size="182" letter-spacing="1">
      <tspan font-weight="400">LOGIS</tspan><tspan font-weight="700">TIK</tspan>
    </text>
  </g>
</svg>